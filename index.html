<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f1e8">
<title>Task Roadmap</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Roadmap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f1e8;
    --bg-card: #fefcf7;
    --ink: #1a1a1a;
    --ink-soft: #4a4a4a;
    --ink-mute: #888;
    --line: #d8d2c4;
    --line-soft: #ebe6d8;
    --accent: #b8462a;
    --accent-soft: #e8d0c4;
    --gold: #a88a4a;
    --green: #4a7a4a;
    --green-soft: #d4e0d0;
    --amber: #c89a3a;
    --amber-soft: #f0e2c0;
    --red: #a84030;
    --red-soft: #f0d4d0;
    --depend: #c8884a;
    --depend-soft: #f0e0c8;
    --approve: #7a5a8a;
    --approve-soft: #e2d8e8;
    --stay: #888;
    --stay-soft: #d8d2c4;
    --shadow-lift: 0 2px 4px rgba(0,0,0,0.06), 0 12px 28px rgba(0,0,0,0.08);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans JP', 'Fraunces', serif;
    background: var(--bg);
    color: var(--ink);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184,70,42,0.04), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(168,138,74,0.05), transparent 50%);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .app { max-width: 1400px; margin: 0 auto; padding: 24px 28px calc(80px + var(--safe-bottom)); }
  .header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 24px; gap: 16px; }
  .brand .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 4px; }
  .brand h1 { font-family: 'Fraunces', serif; font-size: 38px; letter-spacing: -0.02em; font-weight: 500; line-height: 1; }
  .brand h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); text-align: right; line-height: 1.6; }
  .icon-circle-btn { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--bg-card); cursor: pointer; font-family: 'Fraunces', serif; font-style: italic; font-size: 16px; color: var(--ink-soft); transition: all 0.2s ease; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center; }
  .icon-circle-btn:hover, .icon-circle-btn:active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sync-indicator { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 4px 9px; border-radius: 100px; letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.3s ease; white-space: nowrap; }
  .sync-indicator.idle { background: var(--green-soft); color: var(--green); }
  .sync-indicator.syncing { background: var(--amber-soft); color: #8a6820; }
  .sync-indicator.error { background: var(--red-soft); color: var(--red); }
  .sync-indicator.offline { background: var(--line-soft); color: var(--ink-mute); }

  .switcher { display: flex; gap: 0; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .switch-btn { padding: 14px 24px 16px; background: transparent; border: none; border-bottom: 2px solid transparent; font-family: 'Fraunces', serif; font-size: 17px; color: var(--ink-mute); cursor: pointer; transition: all 0.25s ease; margin-bottom: -1px; }
  .switch-btn .num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); margin-right: 8px; vertical-align: 2px; }
  .switch-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
  .switch-btn.active .num { color: var(--accent); }

  /* Tag filter chips */
  .filter-row { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filter-row .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-right: 4px;
  }
  .tag-chip {
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--line);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    border-radius: 100px;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .tag-chip .tag-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
  }
  .tag-chip.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  .tag-chip.active .tag-count { color: var(--bg); opacity: 0.7; }
  .tag-chip .tag-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .tag-chip.manage-btn {
    border-style: dashed;
    color: var(--ink-mute);
    margin-left: auto;
  }
  .tag-chip.manage-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* Dashboard: project highlights list (Summary view only) */
  .summary-view { display: none; }
  .summary-view.active { display: block; }
  .dashboard {
    background: var(--bg-card);
    border: 1px solid var(--line);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(to right, rgba(184,70,42,0.03), transparent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .dashboard-header .summary-stats {
    display: flex;
    gap: 16px;
  }
  .dashboard-header .summary-stat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .dashboard-header .summary-stat strong {
    font-family: 'Fraunces', serif;
    font-style: normal;
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
  }
  .dashboard-header .summary-stat.alert strong { color: var(--red); }
  .pj-row {
    display: grid;
    grid-template-columns: 1fr auto 50px 50px;
    gap: 14px;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line-soft);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .pj-row:last-child { border-bottom: none; }
  .pj-row:hover { background: rgba(184,70,42,0.03); }
  .pj-row:active { background: rgba(184,70,42,0.06); }
  .pj-row .pj-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.4;
    word-break: break-word;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pj-row .pj-tags {
    display: inline-flex;
    gap: 4px;
  }
  .pj-row .pj-tags .tag-dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .pj-row .pj-bar-wrap {
    width: 140px;
    height: 6px;
    background: var(--line-soft);
    border-radius: 100px;
    overflow: hidden;
    position: relative;
  }
  .pj-row .pj-bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.4s ease;
    background: linear-gradient(to right, var(--accent), #d96a4a);
  }
  .pj-row .pj-pct {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    text-align: right;
    font-weight: 500;
  }
  .pj-row .pj-nodes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    text-align: right;
  }
  .pj-row.has-alert::before {
    content: '⚠';
    position: absolute;
    color: var(--red);
    margin-left: -14px;
    font-size: 11px;
  }
  .pj-row { position: relative; }
  .dashboard .empty-pj {
    padding: 30px;
    text-align: center;
    color: var(--ink-mute);
    font-size: 13px;
  }

  /* Highlight target on jump */
  .project-card {
    scroll-margin-top: 220px;
  }
  body.scrolled .project-card {
    scroll-margin-top: 130px;
  }
  .project-card.highlight-jumped {
    animation: highlightFlash 1.5s ease;
  }
  @keyframes highlightFlash {
    0%, 100% { box-shadow: none; }
    30% { box-shadow: 0 0 0 3px var(--accent); }
  }

  /* Bottleneck grid (per-tag dashboard for Projects/Routines pages) */
  .bottleneck-grid {
    background: var(--bg-card);
    border: 1px solid var(--line);
    margin-bottom: 24px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .bottleneck-table {
    width: 100%;
    min-width: 540px;
    border-collapse: collapse;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .bottleneck-table thead th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-mute);
    padding: 10px 12px;
    text-align: center;
    background: linear-gradient(to bottom, rgba(184,70,42,0.04), transparent);
    border-bottom: 1px solid var(--line-soft);
    font-weight: 500;
  }
  .bottleneck-table thead th.tag-col {
    text-align: left;
    padding-left: 18px;
  }
  .bottleneck-table tbody td {
    padding: 12px 12px;
    text-align: center;
    border-bottom: 1px solid var(--line-soft);
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }
  .bottleneck-table tbody tr:last-child td { border-bottom: none; }
  .bottleneck-table tbody td.tag-col {
    text-align: left;
    padding-left: 18px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 130px;
  }
  .bottleneck-table tbody td.tag-col .tag-dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex-shrink: 0;
  }
  .bottleneck-table tbody td.zero {
    color: var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }
  .bottleneck-table tbody td.alert {
    color: var(--red);
    background: rgba(168,64,48,0.05);
  }
  .bottleneck-table tbody td.warn {
    color: #8a6820;
  }
  .bottleneck-table tbody tr.totals-row td {
    border-top: 2px solid var(--ink);
    background: var(--line-soft);
    font-weight: 600;
    font-size: 17px;
  }
  .bottleneck-empty {
    padding: 24px;
    text-align: center;
    color: var(--ink-mute);
    font-size: 13px;
  }
  /* Sticky header on scroll */
  .sticky-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    transition: padding 0.2s ease, box-shadow 0.2s ease;
    padding-top: 0;
  }
  body.scrolled .sticky-bar {
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    padding: 8px 0;
  }

  /* Active focus banner */
  .focus-banner {
    display: none;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink);
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .focus-banner.active { display: flex; }
  .focus-banner strong { color: var(--accent); font-weight: 600; }
  .focus-banner .clear-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }
  .focus-banner .clear-btn:hover { background: var(--accent); color: white; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
  .toolbar-left { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.3; }
  .toolbar-left .desc { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; color: var(--ink-mute); margin-left: 10px; font-weight: 400; }
  .toolbar-right { display: flex; gap: 8px; }
  .btn { padding: 10px 18px; background: var(--ink); color: var(--bg); border: none; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; min-height: 40px; }
  .btn:hover, .btn:active { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover, .btn.ghost:active { background: var(--bg-card); border-color: var(--ink); }
  .btn.btn-sm { padding: 6px 14px; font-size: 12px; min-height: 32px; }

  .archive-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    cursor: pointer;
    user-select: none;
  }
  .archive-toggle:hover { color: var(--ink); }
  .archive-toggle input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--accent); }

  .roadmap { display: none; }
  .roadmap.active { display: block; }
  .project-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    margin-bottom: 20px;
    overflow: hidden;
    transition: opacity 0.3s ease;
  }
  .project-card.archived { opacity: 0.5; background: var(--line-soft); }
  .project-card.dragging { opacity: 0.4; }
  .project-card.drag-over-top { border-top: 3px solid var(--accent); }
  .project-card.drag-over-bottom { border-bottom: 3px solid var(--accent); }

  .project-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(to right, rgba(184,70,42,0.02), transparent);
    gap: 12px;
  }
  .drag-handle {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-mute);
    cursor: grab;
    flex-shrink: 0;
    user-select: none;
    touch-action: none;
    font-size: 14px;
    line-height: 1;
  }
  .drag-handle:active { cursor: grabbing; color: var(--accent); }
  .project-head h3 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; line-height: 1.35; flex: 1; min-width: 0; word-break: break-word; }
  .project-tags-inline {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .tag-pill {
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-family: 'Noto Sans JP', sans-serif;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag-pill .tag-dot { width: 6px; height: 6px; border-radius: 50%; }
  .project-head .pj-meta { display: flex; align-items: center; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-mute); flex-shrink: 0; }
  .progress-circle { width: 36px; height: 36px; position: relative; flex-shrink: 0; }
  .progress-circle svg { transform: rotate(-90deg); }
  .progress-circle .pc-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; }
  .pj-actions { display: flex; gap: 6px; }
  .icon-btn { width: 32px; height: 32px; background: transparent; border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-mute); transition: all 0.2s ease; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
  .icon-btn:hover, .icon-btn:active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .icon-btn.danger:hover, .icon-btn.danger:active { background: var(--red); border-color: var(--red); }
  .icon-btn.archive:hover, .icon-btn.archive:active { background: var(--gold); border-color: var(--gold); }

  .project-head-main { flex: 1; min-width: 0; }

  .nodes { padding: 22px 18px 24px; position: relative; }
  .node-row { display: grid; grid-template-columns: 18px 32px 1fr; gap: 8px; position: relative; padding-bottom: 10px; align-items: start; }
  .node-row::before { content: ''; position: absolute; left: 41px; top: 32px; bottom: -2px; width: 1px; background: var(--line); }
  .node-row:last-of-type::before { display: none; }
  .node-row.dragging { opacity: 0.4; }
  .node-row.drag-over-top { box-shadow: 0 -2px 0 var(--accent); }
  .node-row.drag-over-bottom { box-shadow: 0 2px 0 var(--accent); }

  .node-drag-handle {
    width: 18px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--line);
    cursor: grab;
    user-select: none;
    touch-action: none;
    font-size: 11px;
    margin-top: 2px;
  }
  .node-drag-handle:hover { color: var(--ink-mute); }
  .node-drag-handle:active { cursor: grabbing; color: var(--accent); }

  .node-marker { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; color: var(--ink-mute); z-index: 1; flex-shrink: 0; cursor: pointer; transition: all 0.2s ease; user-select: none; }
  .node-marker:active { transform: scale(0.92); }
  .node-row[data-status="done"] .node-marker { background: var(--green); border-color: var(--green); color: white; }
  .node-row[data-status="doing"] .node-marker { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 0 4px var(--accent-soft); }
  .node-row[data-status="depend"] .node-marker { background: var(--depend); border-color: var(--depend); color: white; box-shadow: 0 0 0 4px var(--depend-soft); }
  .node-row[data-status="approve"] .node-marker { background: var(--approve); border-color: var(--approve); color: white; box-shadow: 0 0 0 4px var(--approve-soft); }
  .node-row[data-status="stay"] .node-marker { background: var(--stay); border-color: var(--stay); color: white; }
  .node-row[data-status="stay"] .node-title { color: var(--ink-mute); font-style: italic; }
  .node-body { padding: 6px 0 10px; cursor: pointer; min-width: 0; }
  .node-title { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.5; margin-bottom: 5px; word-break: break-word; }
  .node-row[data-status="done"] .node-title { text-decoration: line-through; color: var(--ink-mute); }
  .node-meta { display: flex; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); align-items: center; flex-wrap: wrap; }
  .pill { padding: 2px 8px; border: 1px solid var(--line); border-radius: 100px; font-size: 10px; letter-spacing: 0.05em; }
  .pill.priority-high { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .pill.priority-mid { background: var(--amber-soft); border-color: var(--amber); color: #8a6820; }
  .pill.priority-low { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .pill.due-overdue { background: var(--red-soft); border-color: var(--red); color: var(--red); font-weight: 600; }
  .pill.due-soon { background: var(--amber-soft); border-color: var(--amber); color: #8a6820; }
  .node-note { font-size: 12px; color: var(--ink-soft); margin-top: 6px; padding: 8px 10px; background: var(--line-soft); border-left: 2px solid var(--gold); line-height: 1.6; word-break: break-word; }

  .add-node-row { display: grid; grid-template-columns: 18px 32px 1fr; gap: 8px; margin-top: 4px; }
  .add-node-btn { background: transparent; border: 1px dashed var(--line); padding: 10px 14px; text-align: left; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--ink-mute); transition: all 0.2s ease; min-height: 40px; }
  .add-node-btn:hover, .add-node-btn:active { border-color: var(--accent); color: var(--accent); }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }

  .modal { background: var(--bg-card); width: 100%; max-width: 540px; padding: 28px; border: 1px solid var(--line); box-shadow: var(--shadow-lift); max-height: 92vh; overflow-y: auto; }

</style>

<body>

<div id="setupScreen" class="setup-screen" style="display:none">
  <div class="brand">
    <div style="font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.18em; color:var(--ink-mute); margin-bottom:6px">— PERSONAL OPERATING SYSTEM —</div>
    <h1>Task <em>Roadmap</em></h1>
  </div>
  <div class="setup-card">
    <h2>初期設定</h2>
    <p class="lead">GitHubリポジトリと連携して、複数の端末でデータを同期します。最初に一度だけ設定が必要です。</p>
    <div class="field"><label>GitHub ユーザー名</label><input id="setupUser" placeholder="例: apra-GrowthStrategy-gh" autocomplete="off"></div>
    <div class="field"><label>データ用リポジトリ名</label><input id="setupRepo" placeholder="例: task_management_data" autocomplete="off"></div>
    <div class="field"><label>Personal Access Token</label><input id="setupToken" type="password" placeholder="github_pat_..." autocomplete="off"><div class="help-text">トークンはこの端末のブラウザにのみ保存され、外部に送信されません(GitHub APIを除く)。</div></div>

    </div>

<script>
  const STATE = {
    view: 'summary',
    cycle: 'daily',
    weeklyMode: 'all', // 'all' (default) or 'today'
    focusFilter: null, // null | 'today-focus' | 'awaiting'
    projects: [],
    routines: { daily: [], weekly: [], monthly: [] },
    routineLastReset: { daily: '', weekly: '', monthly: '' },
    tags: [],  // [{id, name, color}]
    activeFilters: [], // tag IDs; empty means ALL
    showArchived: false,
    sha: null,
    pendingSave: false,
    saveTimer: null
  };
  const CONFIG_KEY = 'task_roadmap_config_v1';
  const CACHE_KEY = 'task_roadmap_cache_v1';
  const DATA_FILE = 'data.json';

  // Tag color palette (rotates)
  const TAG_COLORS = [
    '#b8462a', // terracotta
    '#a88a4a', // gold
    '#4a7a4a', // green
    '#5a6a8a', // blue-gray
    '#8a5a8a', // purple
    '#c89a3a', // amber
    '#7a4a4a', // brown
    '#4a8a8a', // teal
  ];

  function getConfig() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); }
    catch (e) { return null; }
  }
  function setConfig(cfg) { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }

  // ============ GitHub API ============
  async function ghFetch(path, options = {}) {
    const cfg = getConfig();
    if (!cfg) throw new Error('NO_CONFIG');
    const url = `https://api.github.com/repos/${cfg.user}/${cfg.repo}/contents/${path}`;
    const headers = {
      'Authorization': `Bearer ${cfg.token}`,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    };
    return fetch(url, { ...options, headers });
  }
  async function ghLoadData() {
    const res = await ghFetch(DATA_FILE);
    if (res.status === 404) return { found: false };
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const json = await res.json();
    const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ''))));
    return { found: true, data: JSON.parse(content), sha: json.sha };
  }
  async function ghSaveData(data, prevSha) {
    const json = JSON.stringify(data, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    const body = { message: `Update tasks · ${new Date().toISOString()}`, content: b64 };
    if (prevSha) body.sha = prevSha;
    const res = await ghFetch(DATA_FILE, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`Save failed: HTTP ${res.status}: ${await res.text()}`);
    const result = await res.json();
    return result.content.sha;
  }
  async function ghTestConnection(user, repo, token) {
    const url = `https://api.github.com/repos/${user}/${repo}`;
    const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' } });
    if (res.status === 401) return { ok: false, msg: 'トークンが無効です。' };
    if (res.status === 404) return { ok: false, msg: 'リポジトリが見つかりません。' };
    if (!res.ok) return { ok: false, msg: `HTTP ${res.status}` };
    return { ok: true };
  }

  function setSyncStatus(status, label) {
    const el = document.getElementById('syncIndicator');
    el.className = `sync-indicator ${status}`;
    el.textContent = label;
  }
  function cacheSet(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data, savedAt: Date.now() })); } catch (e) {} }
  function cacheGet() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; } }

  async function loadData() {
    setSyncStatus('syncing', 'LOADING');
    try {
      const result = await ghLoadData();
      if (result.found) {
        const data = result.data;
        // Migrate legacy data: add tags, archived flag, etc.
        STATE.projects = (data.projects || []).map(p => ({
          ...p,
          tagIds: p.tagIds || [],
          archived: !!p.archived,
          nodes: (p.nodes || []).map(n => ({
            ...n,
            // Migrate legacy 'blocked' status to 'stay'
            status: n.status === 'blocked' ? 'stay' : n.status
          }))
        }));
        STATE.routines = data.routines || { daily: [], weekly: [], monthly: [] };
        ['daily','weekly','monthly'].forEach(c => {
          STATE.routines[c] = STATE.routines[c].map(r => ({
            ...r,
            tagIds: r.tagIds || [],
            // Weekly only: dayOfWeek is array of 0-6 (Sun-Sat). Empty = anytime.
            dayOfWeek: r.dayOfWeek || []
          }));
        });
        STATE.routineLastReset = data.routineLastReset || { daily:'', weekly:'', monthly:'' };
        STATE.tags = data.tags || [];
        STATE.sha = result.sha;
        cacheSet(data);
        setSyncStatus('idle', 'SYNCED');
      } else {
        seedDefaults();
        await saveDataNow();
        setSyncStatus('idle', 'SYNCED');
      }
    } catch (e) {
      console.warn('Load failed:', e);
      const cached = cacheGet();
      if (cached) {
        const data = cached.data;
        STATE.projects = data.projects || [];
        STATE.routines = data.routines || { daily: [], weekly: [], monthly: [] };
        STATE.routineLastReset = data.routineLastReset || { daily:'', weekly:'', monthly:'' };
        STATE.tags = data.tags || [];
        setSyncStatus('offline', 'OFFLINE');
      } else {
        seedDefaults();
        setSyncStatus('error', 'LOAD ERROR');
      }
    }
    checkRoutineReset();
  }
  function debouncedSave() {
    if (STATE.saveTimer) clearTimeout(STATE.saveTimer);
    STATE.pendingSave = true;
    setSyncStatus('syncing', 'SAVING...');
    cacheSet({
      projects: STATE.projects, routines: STATE.routines,
      routineLastReset: STATE.routineLastReset, tags: STATE.tags
    });
    STATE.saveTimer = setTimeout(saveDataNow, 1500);
  }
  async function saveDataNow() {
    if (STATE.saveTimer) { clearTimeout(STATE.saveTimer); STATE.saveTimer = null; }
    const data = {
      projects: STATE.projects, routines: STATE.routines,
      routineLastReset: STATE.routineLastReset, tags: STATE.tags
    };
    setSyncStatus('syncing', 'SAVING...');
    try {
      const newSha = await ghSaveData(data, STATE.sha);
      STATE.sha = newSha;
      STATE.pendingSave = false;
      cacheSet(data);
      setSyncStatus('idle', 'SYNCED');
    } catch (e) {
      console.error('Save failed:', e);
      if (e.message.includes('409') || e.message.includes('sha')) {
        try {
          const fresh = await ghLoadData();
          STATE.sha = fresh.sha;
          setSyncStatus('error', 'CONFLICT');
          alert('別の端末で更新がありました。最新を読み直します。');
          await loadData();
          render();
          return;
        } catch (e2) {}
      }
      setSyncStatus('error', 'SAVE FAILED');
    }
  }

  // Status definitions (single source of truth)
  const STATUS_LABELS = {

  // Tap-cycle order (excludes "stay" - that's toggled via long-press only)
  const STATUS_CYCLE = ['todo', 'doing', 'depend', 'approve', 'done'];

  function checkRoutineReset() {
    const now = new Date();
    const today = now.toISOString().slice(0, 10);
    const weekKey = getWeekKey(now);
    const monthKey = today.slice(0, 7);
    let changed = false;
    if (STATE.routineLastReset.daily !== today) {
      if (STATE.routineLastReset.daily) {
        STATE.routines.daily.forEach(r => { if (r.done) r.streak = (r.streak || 0) + 1; else r.streak = 0; r.done = false; });
        changed = true;
      }
      STATE.routineLastReset.daily = today;
    }
    if (STATE.routineLastReset.weekly !== weekKey) {
      if (STATE.routineLastReset.weekly) {
        STATE.routines.weekly.forEach(r => { if (r.done) r.streak = (r.streak || 0) + 1; else r.streak = 0; r.done = false; });
        changed = true;
      }
      STATE.routineLastReset.weekly = weekKey;
    }
    if (STATE.routineLastReset.monthly !== monthKey) {
      if (STATE.routineLastReset.monthly) {
        STATE.routines.monthly.forEach(r => { if (r.done) r.streak = (r.streak || 0) + 1; else r.streak = 0; r.done = false; });
        changed = true;
      }
      STATE.routineLastReset.monthly = monthKey;
    }
    if (changed) debouncedSave();
  }
  function getWeekKey(d) {
    const target = new Date(d);
    target.setHours(0, 0, 0, 0);
    target.setDate(target.getDate() + 3 - ((target.getDay() + 6) % 7));
    const week1 = new Date(target.getFullYear(), 0, 4);
    const wn = 1 + Math.round(((target - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
    return target.getFullYear() + '-W' + String(wn).padStart(2, '0');
  }

  // ============ Filter logic ============
  function matchesFilter(tagIds) {
    if (STATE.activeFilters.length === 0) return true;
    if (!tagIds || tagIds.length === 0) {
      // Show untagged items only if "untagged" filter selected
      return STATE.activeFilters.includes('__untagged__');
    }
    return tagIds.some(t => STATE.activeFilters.includes(t));
  }

  function getFilteredProjects() {
    return STATE.projects.filter(p => {
      if (!STATE.showArchived && p.archived) return false;
      return matchesFilter(p.tagIds);
    });
  }
  function getFilteredRoutines(cycle) {
    let items = STATE.routines[cycle].filter(r => matchesFilter(r.tagIds));
    // Apply weekly day-of-week filter when in WEEKLY + today mode
    if (cycle === 'weekly' && STATE.weeklyMode === 'today') {
      const todayDow = new Date().getDay(); // 0=Sun ... 6=Sat
      items = items.filter(r => {
        // No day specified = "anytime this week" → always show
        if (!r.dayOfWeek || r.dayOfWeek.length === 0) return true;
        // Otherwise show only if today matches
        return r.dayOfWeek.includes(todayDow);
      });
    }
    return items;
  }

  // Apply focus filter at the node level
  function nodeMatchesFocus(n, today) {
    if (!STATE.focusFilter) return true;
    if (STATE.focusFilter === 'today-focus') {
      // Doing OR overdue (and not done/stay)
      if (n.status === 'doing') return true;
      if (n.due && n.status !== 'done' && n.status !== 'stay' && new Date(n.due) < new Date(today)) return true;
      return false;
    }
    if (STATE.focusFilter === 'awaiting') {
      return n.status === 'depend' || n.status === 'approve';
    }
    return true;
  }

  function countItemsWithTag(tagId) {
    let c = 0;
    STATE.projects.forEach(p => { if ((p.tagIds || []).includes(tagId)) c++; });
    ['daily','weekly','monthly'].forEach(cy => {
      STATE.routines[cy].forEach(r => { if ((r.tagIds || []).includes(tagId)) c++; });

  }
  function countUntagged() {
    let c = 0;
    STATE.projects.forEach(p => { if (!p.tagIds || p.tagIds.length === 0) c++; });

  // ============ Bottleneck grids ============
  function renderProjectsBottleneck() {
    const root = document.getElementById('projectsBottleneck');
    const today = new Date().toISOString().slice(0, 10);
    // Group active project nodes by tag
    const activeProjects = STATE.projects.filter(p => !p.archived);
    const tagBuckets = {}; // tagId -> {doing, depend, approve, overdue, total}
    const noTag = { doing: 0, depend: 0, approve: 0, overdue: 0, total: 0 };
    STATE.tags.forEach(t => {
      tagBuckets[t.id] = { doing: 0, depend: 0, approve: 0, overdue: 0, total: 0 };
    });

    activeProjects.forEach(p => {
      const targets = (p.tagIds && p.tagIds.length > 0) ? p.tagIds : ['__none__'];
      p.nodes.forEach(n => {
        const isOverdue = n.due && n.status !== 'done' && n.status !== 'stay' && new Date(n.due) < new Date(today);
        targets.forEach(tid => {
          const bucket = tid === '__none__' ? noTag : tagBuckets[tid];
          if (!bucket) return;
          bucket.total++;
          if (n.status === 'doing') bucket.doing++;
          else if (n.status === 'depend') bucket.depend++;
          else if (n.status === 'approve') bucket.approve++;
          if (isOverdue) bucket.overdue++;
        });
      });
    });

    // Build rows: only tags that have at least one node
    const rows = [];
    STATE.tags.forEach(t => {
      const b = tagBuckets[t.id];
      if (b.total > 0) rows.push({ tag: t, ...b });
    });
    if (noTag.total > 0) {
      rows.push({ tag: { name: '未分類', color: '#bbb' }, ...noTag });
    }
    // Totals
    const totals = rows.reduce((acc, r) => {
      acc.doing += r.doing; acc.depend += r.depend; acc.approve += r.approve; acc.overdue += r.overdue; acc.total += r.total;
      return acc;
    }, { doing: 0, depend: 0, approve: 0, overdue: 0, total: 0 });

    if (rows.length === 0) {
      root.innerHTML = `<div class="bottleneck-empty">アクティブなアクションがありません</div>`;
      return;
    }

    const cell = (n, cls) => n === 0 ? `<td class="zero">—</td>` : `<td class="${cls || ''}">${n}</td>`;

    root.innerHTML = `
      <table class="bottleneck-table">
        <thead>
          <tr>
            <th class="tag-col">タグ</th>
            <th>進行中</th>
            <th>依頼中</th>
            <th>決裁待ち</th>
            <th>期限超過</th>
            <th>合計</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="tag-col"><span class="tag-dot" style="background:${r.tag.color}"></span>${escapeHtml(r.tag.name)}</td>
              ${cell(r.doing)}
              ${cell(r.depend, 'warn')}
              ${cell(r.approve, 'warn')}
              ${cell(r.overdue, r.overdue > 0 ? 'alert' : '')}
              <td>${r.total}</td>
            </tr>
          `).join('')}
          <tr class="totals-row">
            <td class="tag-col">合計</td>
            <td>${totals.doing || '—'}</td>
            <td>${totals.depend || '—'}</td>
            <td>${totals.approve || '—'}</td>
            <td class="${totals.overdue > 0 ? 'alert' : ''}">${totals.overdue || '—'}</td>
            <td>${totals.total}</td>
          </tr>
        </tbody>
      </table>`;
  }

  function renderRoutinesBottleneck() {
    const root = document.getElementById('routinesBottleneck');
    const todayDow = new Date().getDay();
    // For routines: count by tag × cycle, and "today's not done"
    const tagBuckets = {};
    const noTag = { daily_pending: 0, weekly_pending: 0, monthly_pending: 0, total: 0 };
    STATE.tags.forEach(t => {
      tagBuckets[t.id] = { daily_pending: 0, weekly_pending: 0, monthly_pending: 0, total: 0 };
    });

    const countCycle = (cycle, key) => {
      STATE.routines[cycle].forEach(r => {
        const targets = (r.tagIds && r.tagIds.length > 0) ? r.tagIds : ['__none__'];
        // For weekly: only count if today matches
        if (cycle === 'weekly') {
          if (r.dayOfWeek && r.dayOfWeek.length > 0 && !r.dayOfWeek.includes(todayDow)) return;
        }
        const isPending = !r.done;
        targets.forEach(tid => {
          const bucket = tid === '__none__' ? noTag : tagBuckets[tid];
          if (!bucket) return;
          bucket.total++;
          if (isPending) bucket[key]++;
        });
      });
    };
    countCycle('daily', 'daily_pending');
    countCycle('weekly', 'weekly_pending');
    countCycle('monthly', 'monthly_pending');

    const rows = [];
    STATE.tags.forEach(t => {
      const b = tagBuckets[t.id];
      if (b.total > 0) rows.push({ tag: t, ...b });
    });
    if (noTag.total > 0) {
      rows.push({ tag: { name: '未分類', color: '#bbb' }, ...noTag });
    }
    const totals = rows.reduce((acc, r) => {
      acc.daily_pending += r.daily_pending; acc.weekly_pending += r.weekly_pending; acc.monthly_pending += r.monthly_pending; acc.total += r.total;
      return acc;
    }, { daily_pending: 0, weekly_pending: 0, monthly_pending: 0, total: 0 });

    if (rows.length === 0) {
      root.innerHTML = `<div class="bottleneck-empty">ルーティンがありません</div>`;
      return;
    }

    const cell = (n, cls) => n === 0 ? `<td class="zero">—</td>` : `<td class="${cls || ''}">${n}</td>`;

    root.innerHTML = `
      <table class="bottleneck-table">
        <thead>
          <tr>
            <th class="tag-col">タグ</th>
            <th>DAILY 未</th>

  function getTagById(id) { return STATE.tags.find(t => t.id === id); }
  function renderTagPills(tagIds) {

  function renderProject(p) {
    const STATUS_WEIGHT = { todo: 0, doing: 0.25, depend: 0.5, approve: 0.75, done: 1 };

    const pct = activeNodes.length > 0 ? Math.round((sumWeight / activeNodes.length) * 100) : 0;
    const r = 14, c = 2 * Math.PI * r, off = c - (pct / 100) * c;

  function renderNode(pjId, n, idx) {
    const num = String(idx + 1).padStart(2, '0');

    const priorityPill = n.priority ? `<span class="pill priority-${n.priority}">${n.priority === 'high' ? 'HIGH' : n.priority === 'mid' ? 'MID' : 'LOW'}</span>` : '';

      const today = new Date().toISOString().slice(0, 10);
      const diff = (new Date(n.due) - new Date(today)) / 86400000;
      let cls = '';
      if (diff < 0 && n.status !== 'done') cls = 'due-overdue';
      else if (diff <= 3 && n.status !== 'done') cls = 'due-soon';
      duePill = `<span class="pill ${cls}">${n.due}</span>`;

    return `
      <div class="node-row" data-status="${n.status}" data-nid="${n.id}" draggable="true">

  function renderRoutines() {

  function renderDowBadge(dows, todayDow) {
    const labels = ['日','月','火','水','木','金','土'];
    return `<div class="r-dow-badge">${dows.slice().sort((a,b)=>a-b).map(d =>
      `<span class="dow-mini ${d === todayDow ? 'today' : ''}">${labels[d]}</span>`
    ).join('')}</div>`;

  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ============ Drag & Drop (with touch support) ============
  let dragState = null; // { type, id, parentId?, ghost? }

  function getNextColor() {
    return TAG_COLORS[STATE.tags.length % TAG_COLORS.length];
  }

  // Long-press detection state
  let longPressTimer = null;
  let suppressNextClick = false;

  function attachDragHandlers() {
    // Desktop HTML5 drag
    document.querySelectorAll('[draggable="true"]').forEach(el => {
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragover', onDragOver);
      el.addEventListener('drop', onDrop);
      el.addEventListener('dragend', onDragEnd);
      el.addEventListener('dragleave', onDragLeave);
    });
    // Touch drag (long-press to initiate)
    document.querySelectorAll('[data-drag]').forEach(handle => {
      handle.addEventListener('touchstart', onTouchStart, { passive: false });
    });
    // Long-press on node markers for stay toggle
    document.querySelectorAll('.node-marker[data-act="cycle-status"]').forEach(el => {
      attachLongPressForStay(el);
    });
  }

  function attachLongPressForStay(el) {
    let pressTimer = null;
    let pressed = false;

    const start = (clientX, clientY) => {
      pressed = true;
      pressTimer = setTimeout(() => {
        if (!pressed) return;
        suppressNextClick = true;
        // Trigger stay toggle programmatically
        const pjid = el.dataset.pjid;
        const id = el.dataset.id;
        const p = STATE.projects.find(x => x.id === pjid);
        const n = p?.nodes.find(x => x.id === id);
        if (n) {
          if (n.status === 'stay') {
            n.status = n.prevStatus || 'todo';
            delete n.prevStatus;
          } else {
            n.prevStatus = n.status;
            n.status = 'stay';
          }
          // Visual feedback: subtle pulse
          el.style.transform = 'scale(1.15)';
          setTimeout(() => { el.style.transform = ''; }, 150);
          render();
          attachDragHandlers();
          debouncedSave();
        }
      }, 500);
    };
    const cancel = () => {
      pressed = false;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY));
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);

    el.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      start(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('touchmove', cancel);
  }

  function onDragStart(e) {
    const card = e.currentTarget;
    if (card.classList.contains('project-card')) {
      dragState = { type: 'project', id: card.dataset.pjid };
    } else if (card.classList.contains('node-row')) {
      const pjid = card.closest('.nodes').dataset.pjid;
      dragState = { type: 'node', id: card.dataset.nid, parentId: pjid };
    } else if (card.classList.contains('routine-item')) {
      dragState = { type: 'routine', id: card.dataset.rid };
    }
    if (!dragState) return;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragState.id); } catch (e) {}
  }
  function onDragOver(e) {
    if (!dragState) return;
    e.preventDefault();
    const target = e.currentTarget;
    // Only allow same-type drops
    if (dragState.type === 'project' && !target.classList.contains('project-card')) return;
    if (dragState.type === 'node' && !target.classList.contains('node-row')) return;
    if (dragState.type === 'routine' && !target.classList.contains('routine-item')) return;
    // For nodes, must be in same project
    if (dragState.type === 'node') {
      const pjid = target.closest('.nodes').dataset.pjid;
      if (pjid !== dragState.parentId) return;
    }
    const rect = target.getBoundingClientRect();
    const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
    target.classList.remove('drag-over-top', 'drag-over-bottom');
    target.classList.add(isTopHalf ? 'drag-over-top' : 'drag-over-bottom');
  }
  function onDragLeave(e) {
    e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom');
  }
  function onDrop(e) {
    if (!dragState) return;
    e.preventDefault();
    e.stopPropagation();
    const target = e.currentTarget;
    target.classList.remove('drag-over-top', 'drag-over-bottom');
    const rect = target.getBoundingClientRect();
    const isTopHalf = (e.clientY - rect.top) < rect.height / 2;
    let targetId;
    if (dragState.type === 'project') targetId = target.dataset.pjid;
    else if (dragState.type === 'node') targetId = target.dataset.nid;
    else if (dragState.type === 'routine') targetId = target.dataset.rid;
    if (targetId === dragState.id) return;
    performReorder(dragState, targetId, isTopHalf ? 'before' : 'after');
  }
  function onDragEnd(e) {
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
    dragState = null;
  }

  // Touch-based drag
  function onTouchStart(e) {
    const handle = e.currentTarget;
    const type = handle.dataset.drag;
    const id = handle.dataset.id;
    const parentId = handle.dataset.pjid;
    e.preventDefault();
    const card = handle.closest(type === 'project' ? '.project-card' : type === 'node' ? '.node-row' : '.routine-item');
    if (!card) return;
    dragState = { type, id, parentId };
    card.classList.add('dragging');

    // Create ghost
    const rect = card.getBoundingClientRect();
    const ghost = card.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.classList.remove('dragging');
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.offsetY = e.touches[0].clientY - rect.top;

    const onMove = (ev) => {
      ev.preventDefault();
      const t = ev.touches[0];
      ghost.style.top = (t.clientY - dragState.offsetY) + 'px';
      // Find drop target under finger
      ghost.style.display = 'none';
      const elUnder = document.elementFromPoint(t.clientX, t.clientY);
      ghost.style.display = '';
      let targetCard = null;
      if (type === 'project') targetCard = elUnder?.closest('.project-card');
      else if (type === 'node') {
        targetCard = elUnder?.closest('.node-row');
        // Must be same project
        if (targetCard) {
          const tpjid = targetCard.closest('.nodes')?.dataset.pjid;
          if (tpjid !== parentId) targetCard = null;
        }
      }
      else if (type === 'routine') targetCard = elUnder?.closest('.routine-item');
      // Clear previous
      document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
      if (targetCard && targetCard !== card) {
        const r = targetCard.getBoundingClientRect();
        const isTop = (t.clientY - r.top) < r.height / 2;
        targetCard.classList.add(isTop ? 'drag-over-top' : 'drag-over-bottom');
        dragState.dropTarget = targetCard;
        dragState.dropPosition = isTop ? 'before' : 'after';
      } else {
        dragState.dropTarget = null;
      }
    };
    const onEnd = () => {
      handle.removeEventListener('touchmove', onMove);
      handle.removeEventListener('touchend', onEnd);
      handle.removeEventListener('touchcancel', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
      document.querySelectorAll('.drag-over-top, .drag-over-bottom').forEach(el => el.classList.remove('drag-over-top','drag-over-bottom'));
      if (dragState && dragState.dropTarget) {
        let targetId;
        if (type === 'project') targetId = dragState.dropTarget.dataset.pjid;
        else if (type === 'node') targetId = dragState.dropTarget.dataset.nid;
        else if (type === 'routine') targetId = dragState.dropTarget.dataset.rid;
        if (targetId && targetId !== id) {
          performReorder({ type, id, parentId }, targetId, dragState.dropPosition);
        }
      }
      dragState = null;
    };
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('touchcancel', onEnd);
  }

  function performReorder({ type, id, parentId }, targetId, position) {
    let arr;
    if (type === 'project') arr = STATE.projects;
    else if (type === 'node') arr = STATE.projects.find(p => p.id === parentId)?.nodes;
    else if (type === 'routine') arr = STATE.routines[STATE.cycle];
    if (!arr) return;
    const fromIdx = arr.findIndex(x => x.id === id);
    const toIdx = arr.findIndex(x => x.id === targetId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [item] = arr.splice(fromIdx, 1);
    let insertIdx = arr.findIndex(x => x.id === targetId);
    if (position === 'after') insertIdx++;
    arr.splice(insertIdx, 0, item);
    render();
    debouncedSave();
  }

        <div class="help-rule"><span class="key">⋮⋮</span><span class="val">左の<strong>ドラッグハンドル</strong>を掴んで上下に動かすと、順序を変更できます。プロジェクト・ノード・ルーティンすべてで可能。</span></div>
        <div class="help-rule"><span class="key">PC</span><span class="val">ハンドルをマウスでドラッグ。</span></div>
        <div class="help-rule"><span class="key">スマホ</span><span class="val">ハンドルを<strong>長押し→そのまま指を動かす</strong>。</span></div>
      </div>
      <div class="help-section">
        <h3>アーカイブ</h3>
        <div class="help-rule"><span class="key">⊟</span><span class="val">プロジェクトカードの<strong>アーカイブボタン</strong>。完了したものを片付けて視界をスッキリ。</span></div>
        <div class="help-rule"><span class="key">↻</span><span class="val">アーカイブ済みプロジェクトの<strong>復元ボタン</strong>。</span></div>
        <div class="help-rule"><span class="key">表示切替</span><span class="val">「アーカイブ済みも表示」でアーカイブ済みも一覧に表示。</span></div>
      </div>
      <div class="help-section">
        <h3>ボトルネック・グリッド(Projects/Routines)</h3>
        <div class="help-rule"><span class="key">タグ × ステータス</span><span class="val">どのタグのタスクで「進行中」「依頼中」「決裁待ち」「期限超過」が溜まっているか、<strong>一望して分かる</strong>。</span></div>
        <div class="help-rule"><span class="key">⚠ 赤セル</span><span class="val">期限超過があるセルは赤く塗られます。要対応のサイン。</span></div>
        <div class="help-rule"><span class="key">合計行</span><span class="val">下段の太線で全体集計。タグ横断で見たいときに。</span></div>
      </div>
      <div class="help-section">
        <h3>ステータス操作</h3>
        <div class="help-rule"><span class="key">丸タップ</span><span class="val">基本フローを順送り:<strong>未着手 → 進行中 → 依頼中 → 決裁待ち → 完了</strong> → 未着手 ...</span></div>
        <div class="status-legend">
          <div class="legend-row"><div class="legend-dot todo">01</div><strong>未着手</strong> — まだ手をつけていない</div>
          <div class="legend-row"><div class="legend-dot doing">●</div><strong>進行中</strong> — 自分がボールを持っている</div>
          <div class="legend-row"><div class="legend-dot depend">→</div><strong>依頼中</strong> — 他部署/他メンバーがボール</div>
          <div class="legend-row"><div class="legend-dot approve">↑</div><strong>決裁待ち</strong> — 上長の承認・確認待ち</div>
          <div class="legend-row"><div class="legend-dot done">✓</div><strong>完了</strong> — 終わった</div>
          <div class="legend-row"><div class="legend-dot stay">‖</div><strong>ステイ</strong> — 一時停止・保留中</div>
        </div>
        <div class="help-rule" style="margin-top:14px"><span class="key">長押し</span><span class="val"><strong>丸を長押し(0.5秒)</strong>でステイにトグル。停止する前のステータスを記憶しているので、もう一度長押し or 短タップで元の状態に復帰します。</span></div>
        <div class="help-rule"><span class="key">完了率</span><span class="val">未着手0% / 進行中25% / 依頼中50% / 決裁待ち75% / 完了100% で加重計算。ステイは計算から除外されます。</span></div>
        <div class="help-rule"><span class="key">統計</span><span class="val">「In Progress(自分が動かしてる)」「Awaiting(他者・上長待ち)」「On Stay(停止中)」を分けて表示。ボトルネックが一目で分かります。</span></div>
      </div>
      <div class="help-section">
        <h3>同期</h3>
        <div class="help-rule"><span class="key">SYNCED</span><span class="val">変更はGitHubに自動保存。</span></div>
        <div class="help-rule"><span class="key">↻ 再読込</span><span class="val">他端末の最新を取得。</span></div>
      </div>
      <div class="modal-actions"><span></span><div class="right"><button class="btn" data-act="modal-close">閉じる</button></div></div>
    `);
  }

  function modalSettings() {
    const cfg = getConfig() || {};
    openModal(`
      <h2>設定</h2>
      <div class="modal-sub">— GitHub接続情報</div>
      <div class="field"><label>GitHub ユーザー名</label><input id="cfg-user" value="${escapeHtml(cfg.user || '')}"></div>
      <div class="field"><label>リポジトリ名</label><input id="cfg-repo" value="${escapeHtml(cfg.repo || '')}"></div>
      <div class="field"><label>Personal Access Token</label><input id="cfg-token" type="password" placeholder="変更する場合のみ入力"><div class="help-text">空欄のまま保存すると現在のトークンを維持。</div></div>
      <div class="modal-actions">
        <span><button class="btn ghost" style="color:var(--red);border-color:var(--red)" data-act="reset-config">設定削除</button></span>
        <div class="right">
          <button class="btn ghost" data-act="modal-close">キャンセル</button>
          <button class="btn" data-act="save-config">保存</button>
        </div>
      </div>
    `);
  }

  function modalNewProject() {
    openModal(`
      <h2>New Project</h2>
      <div class="modal-sub">— 新しいプロジェクト</div>
      <div class="field"><label>プロジェクト名</label><input id="m-title" placeholder="例: 事業計画書改訂版作成"></div>
      <div class="field"><label>タグ</label><div class="tag-selector" id="tag-selector">${renderTagSelectorChips([])}</div></div>
      <div class="modal-actions"><span></span><div class="right">
        <button class="btn ghost" data-act="modal-close">キャンセル</button>
        <button class="btn" data-act="modal-save-pj">追加</button>
      </div></div>
    `);
    setTimeout(() => document.getElementById('m-title')?.focus(), 100);
  }
  function modalEditProject(p) {
    openModal(`
      <h2>Edit Project</h2>
      <div class="modal-sub">— プロジェクトを編集</div>
      <div class="field"><label>プロジェクト名</label><input id="m-title" value="${escapeHtml(p.title)}"></div>
      <div class="field"><label>タグ</label><div class="tag-selector" id="tag-selector">${renderTagSelectorChips(p.tagIds || [])}</div></div>
      <div class="modal-actions"><span></span><div class="right">
        <button class="btn ghost" data-act="modal-close">キャンセル</button>
        <button class="btn" data-act="modal-save-pj-edit" data-id="${p.id}">保存</button>
      </div></div>
    `);
  }
  function modalNode(pjId, node) {
    const isNew = !node;
    const n = node || { title: '', status: 'todo', priority: 'mid', due: '', note: '' };
    openModal(`
      <h2>${isNew ? 'New Action' : 'Edit Action'}</h2>
      <div class="modal-sub">— ${isNew ? 'アクションを追加' : 'アクションを編集'}</div>
      <div class="field"><label>アクション内容</label><input id="n-title" value="${escapeHtml(n.title)}"></div>
      <div class="field-row">
        <div class="field"><label>ステータス</label><select id="n-status">
          <option value="todo" ${n.status==='todo'?'selected':''}>未着手</option>
          <option value="doing" ${n.status==='doing'?'selected':''}>進行中</option>
          <option value="depend" ${n.status==='depend'?'selected':''}>依頼中</option>
          <option value="approve" ${n.status==='approve'?'selected':''}>決裁待ち</option>
          <option value="done" ${n.status==='done'?'selected':''}>完了</option>
          <option value="stay" ${n.status==='stay'?'selected':''}>ステイ</option>
        </select></div>
        <div class="field"><label>優先度</label><select id="n-priority">
          <option value="high" ${n.priority==='high'?'selected':''}>HIGH</option>
          <option value="mid" ${n.priority==='mid'?'selected':''}>MID</option>
          <option value="low" ${n.priority==='low'?'selected':''}>LOW</option>
        </select></div>
      </div>
      <div class="field"><label>期限</label><input type="date" id="n-due" value="${n.due || ''}"></div>
      <div class="field"><label>メモ</label><textarea id="n-note">${escapeHtml(n.note || '')}</textarea></div>
      <div class="modal-actions">
        <span>${!isNew ? `<button class="btn ghost" style="color:var(--red);border-color:var(--red)" data-act="del-node" data-pjid="${pjId}" data-id="${n.id}">削除</button>` : ''}</span>
        <div class="right">
          <button class="btn ghost" data-act="modal-close">キャンセル</button>
          <button class="btn" data-act="${isNew ? 'modal-save-node-new' : 'modal-save-node-edit'}" data-pjid="${pjId}" data-id="${n.id || ''}">${isNew ? '追加' : '保存'}</button>
        </div>
      </div>
    `);
    setTimeout(() => document.getElementById('n-title')?.focus(), 100);
  }
  function modalRoutine(routine) {
    const isNew = !routine;
    const r = routine || { title: '', tagIds: [], dayOfWeek: [] };
    const dowSection = STATE.cycle === 'weekly' ? `
      <div class="field">
        <label>曜日指定 <span style="text-transform:none; letter-spacing:0; font-weight:400; color:var(--ink-mute)">(選択しない場合は週内いつでもOK)</span></label>
        <div class="dow-selector" id="dow-selector">
          ${[0,1,2,3,4,5,6].map(d => {
            const labels = ['日','月','火','水','木','金','土'];
            const sel = (r.dayOfWeek || []).includes(d);
            const isToday = d === new Date().getDay();
            return `<div class="dow-chip ${sel ? 'selected' : ''} ${isToday ? 'today-marker' : ''}" data-act="toggle-dow" data-dow="${d}">${labels[d]}</div>`;
          }).join('')}
        </div>
      </div>` : '';
    openModal(`
      <h2>${isNew ? 'New Routine' : 'Edit Routine'}</h2>
      <div class="modal-sub">— ${STATE.cycle.toUpperCase()} routine</div>
      <div class="field"><label>ルーティン名</label><input id="r-title" value="${escapeHtml(r.title)}"></div>
      ${dowSection}
      <div class="field"><label>タグ</label><div class="tag-selector" id="tag-selector">${renderTagSelectorChips(r.tagIds || [])}</div></div>
      <div class="modal-actions"><span></span><div class="right">
        <button class="btn ghost" data-act="modal-close">キャンセル</button>
        <button class="btn" data-act="${isNew ? 'modal-save-r-new' : 'modal-save-r-edit'}" data-id="${r.id || ''}">${isNew ? '追加' : '保存'}</button>
      </div></div>
    `);
    setTimeout(() => document.getElementById('r-title')?.focus(), 100);
  }
  function getSelectedDows() {
    return Array.from(document.querySelectorAll('.dow-chip.selected')).map(el => parseInt(el.dataset.dow, 10));
  }

  // Get currently selected tag IDs from modal selector
  function getSelectedTagIds() {
    return Array.from(document.querySelectorAll('.tag-selector-chip.selected')).map(el => el.dataset.id);
  }

  // ============ Setup ============
  function showSetup() {
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('mainApp').style.display = 'none';
    const cfg = getConfig();
    if (cfg) {
      document.getElementById('setupUser').value = cfg.user || '';
      document.getElementById('setupRepo').value = cfg.repo || '';
    }
  }
  function showMain() {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
  }
  document.getElementById('setupSaveBtn').addEventListener('click', async () => {
    const user = document.getElementById('setupUser').value.trim();
    const repo = document.getElementById('setupRepo').value.trim();
    const token = document.getElementById('setupToken').value.trim();
    const result = document.getElementById('setupTestResult');
    result.className = 'test-result';
    if (!user || !repo || !token) { result.className = 'test-result error'; result.textContent = '3項目すべて入力してください'; return; }
    result.className = 'test-result'; result.style.display = 'block'; result.textContent = '接続テスト中...';
    const test = await ghTestConnection(user, repo, token);
    if (!test.ok) { result.className = 'test-result error'; result.textContent = '✕ ' + test.msg; return; }
    result.className = 'test-result success'; result.textContent = '✓ 接続成功。開始します...';
    setConfig({ user, repo, token });
    setTimeout(async () => {
      showMain();
      await loadData();
      document.getElementById('loadingView').style.display = 'none';
      render();
      attachDragHandlers();
    }, 600);
  });

  // ============ Event handlers ============
  document.getElementById('switcher').addEventListener('click', (e) => {
    const btn = e.target.closest('.switch-btn');
    if (!btn) return;
    STATE.view = btn.dataset.view;
    STATE.focusFilter = null;
    render();
    attachDragHandlers();
  });
  document.getElementById('cycleTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.cycle-tab');
    if (!tab) return;
    STATE.cycle = tab.dataset.cycle;
    render();
    attachDragHandlers();
  });
  document.getElementById('weeklySubtabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.weekly-subtab');
    if (!tab) return;
    STATE.weeklyMode = tab.dataset.weeklyMode;
    render();
    attachDragHandlers();
  });
  document.getElementById('showArchivedCheckbox').addEventListener('change', (e) => {
    STATE.showArchived = e.target.checked;
    render();
    attachDragHandlers();
  });

  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;

    if (act === 'modal-close') return closeModal();

    // Dashboard: jump to a specific project card
    if (act === 'jump-project') {
      STATE.view = 'projects';
      STATE.focusFilter = null;
      // Make sure we're on Projects view
      render(); attachDragHandlers();
      const pjid = t.dataset.pjid;
      // Scroll to the project card and flash it
      setTimeout(() => {
        const target = document.querySelector(`.project-card[data-pjid="${pjid}"]`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          target.classList.add('highlight-jumped');
          setTimeout(() => target.classList.remove('highlight-jumped'), 1500);
        }
      }, 50);
      return;
    }
    if (act === 'jump-routines-today') {
      STATE.view = 'routines';
      STATE.cycle = 'daily';
      STATE.focusFilter = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render(); attachDragHandlers();
      return;
    }
    if (act === 'clear-focus') {
      STATE.focusFilter = null;
      render(); attachDragHandlers();
      return;
    }

    // Filter
    if (act === 'filter-all') { STATE.activeFilters = []; render(); attachDragHandlers(); return; }
    if (act === 'filter-tag') {
      const id = t.dataset.id;
      const idx = STATE.activeFilters.indexOf(id);
      if (idx >= 0) STATE.activeFilters.splice(idx, 1);
      else STATE.activeFilters.push(id);
      render(); attachDragHandlers(); return;
    }
    if (act === 'manage-tags') { modalManageTags(); return; }
    if (act === 'add-tag') {
      const input = document.getElementById('newTagName');
      const name = input.value.trim();
      if (!name) return;
      STATE.tags.push({ id: pid(), name, color: getNextColor() });
      debouncedSave();
      modalManageTags();
      return;
    }
    if (act === 'cycle-tag-color') {
      const tag = STATE.tags.find(x => x.id === t.dataset.id);
      if (tag) {
        const idx = TAG_COLORS.indexOf(tag.color);
        tag.color = TAG_COLORS[(idx + 1) % TAG_COLORS.length];
        debouncedSave();
        modalManageTags();
      }
      return;
    }
    if (act === 'del-tag') {
      const tagId = t.dataset.id;
      const usage = countItemsWithTag(tagId);
      if (usage > 0 && !confirm(`このタグは ${usage} 件のアイテムで使用中です。削除すると、それらからタグが外れます。続行しますか?`)) return;
      // Remove from all items
      STATE.projects.forEach(p => { p.tagIds = (p.tagIds || []).filter(id => id !== tagId); });
      ['daily','weekly','monthly'].forEach(cy => {
        STATE.routines[cy].forEach(r => { r.tagIds = (r.tagIds || []).filter(id => id !== tagId); });
      });
      // Remove from filters
      STATE.activeFilters = STATE.activeFilters.filter(id => id !== tagId);
      // Remove tag itself
      STATE.tags = STATE.tags.filter(x => x.id !== tagId);
      debouncedSave();
      modalManageTags();
      // Need to re-render main view too on next close
      return;
    }
    // Tag selector toggle in modals
    if (act === 'toggle-tag-select') {
      t.classList.toggle('selected');
      return;
    }
    // Day-of-week toggle
    if (act === 'toggle-dow') {
      t.classList.toggle('selected');
      return;
    }
    if (act === 'quick-add-tag') {
      const name = prompt('新しいタグ名を入力');
      if (!name || !name.trim()) return;
      const newTag = { id: pid(), name: name.trim(), color: getNextColor() };
      STATE.tags.push(newTag);
      // Re-render the selector with the new tag selected
      const currentSelected = getSelectedTagIds();
      currentSelected.push(newTag.id);
      const selector = document.getElementById('tag-selector');
      if (selector) selector.innerHTML = renderTagSelectorChips(currentSelected);
      debouncedSave();
      return;
    }

    if (act === 'save-config') {
      const user = document.getElementById('cfg-user').value.trim();
      const repo = document.getElementById('cfg-repo').value.trim();
      const tokenInput = document.getElementById('cfg-token').value.trim();
      const cur = getConfig() || {};
      const token = tokenInput || cur.token;
      if (!user || !repo || !token) { alert('すべて必要'); return; }
      const test = await ghTestConnection(user, repo, token);
      if (!test.ok) { alert('テスト失敗: ' + test.msg); return; }
      setConfig({ user, repo, token });
      closeModal();
      STATE.sha = null;
      await loadData();
      render(); attachDragHandlers();
      return;
    }
    if (act === 'reset-config') {
      if (confirm('設定を削除しますか? データはGitHubに残ります。')) {
        localStorage.removeItem(CONFIG_KEY);
        localStorage.removeItem(CACHE_KEY);
        location.reload();
      }
      return;
    }

    // Project ops
    if (act === 'modal-save-pj') {
      const title = document.getElementById('m-title').value.trim();
      if (!title) return;
      STATE.projects.push({ id: pid(), title, tagIds: getSelectedTagIds(), archived: false, nodes: [] });
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'modal-save-pj-edit') {
      const p = STATE.projects.find(x => x.id === t.dataset.id);
      if (p) {
        p.title = document.getElementById('m-title').value.trim() || p.title;
        p.tagIds = getSelectedTagIds();
      }
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'edit-pj') {
      e.stopPropagation();
      const p = STATE.projects.find(x => x.id === t.dataset.id);
      if (p) modalEditProject(p);
      return;
    }
    if (act === 'toggle-archive-pj') {
      e.stopPropagation();
      const p = STATE.projects.find(x => x.id === t.dataset.id);
      if (p) {
        p.archived = !p.archived;
        render(); attachDragHandlers(); debouncedSave();
      }
      return;
    }
    if (act === 'del-pj') {
      e.stopPropagation();
      if (confirm('このプロジェクトを完全に削除しますか?\n(アーカイブではなく完全削除)')) {
        STATE.projects = STATE.projects.filter(x => x.id !== t.dataset.id);
        render(); attachDragHandlers(); debouncedSave();
      }
      return;
    }

    // Node ops
    if (act === 'cycle-status') {
      e.stopPropagation();
      // If long-press fired, the click is suppressed via flag
      if (suppressNextClick) { suppressNextClick = false; return; }
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      const n = p?.nodes.find(x => x.id === t.dataset.id);
      if (n) {
        // If currently 'stay', short tap returns to previous status (or todo)
        if (n.status === 'stay') {
          n.status = n.prevStatus || 'todo';
          delete n.prevStatus;
        } else {
          const idx = STATUS_CYCLE.indexOf(n.status);
          n.status = idx < 0 ? 'todo' : STATUS_CYCLE[(idx + 1) % STATUS_CYCLE.length];
        }
        render(); attachDragHandlers(); debouncedSave();
      }
      return;
    }
    if (act === 'toggle-stay') {
      // Triggered by long-press detection
      e.stopPropagation();
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      const n = p?.nodes.find(x => x.id === t.dataset.id);
      if (n) {
        if (n.status === 'stay') {
          // Resume from stay
          n.status = n.prevStatus || 'todo';
          delete n.prevStatus;
        } else {
          // Park to stay, remember previous state
          n.prevStatus = n.status;
          n.status = 'stay';
        }
        render(); attachDragHandlers(); debouncedSave();
      }
      return;
    }
    if (act === 'add-node') { modalNode(t.dataset.pjid, null); return; }
    if (act === 'edit-node') {
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      const n = p?.nodes.find(x => x.id === t.dataset.id);
      if (n) modalNode(t.dataset.pjid, n);
      return;
    }
    if (act === 'modal-save-node-new') {
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      if (!p) return;
      const title = document.getElementById('n-title').value.trim();
      if (!title) return;
      p.nodes.push({
        id: pid(), title,
        status: document.getElementById('n-status').value,
        priority: document.getElementById('n-priority').value,
        due: document.getElementById('n-due').value,
        note: document.getElementById('n-note').value.trim()
      });
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'modal-save-node-edit') {
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      const n = p?.nodes.find(x => x.id === t.dataset.id);
      if (!n) return;
      n.title = document.getElementById('n-title').value.trim() || n.title;
      n.status = document.getElementById('n-status').value;
      n.priority = document.getElementById('n-priority').value;
      n.due = document.getElementById('n-due').value;
      n.note = document.getElementById('n-note').value.trim();
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'del-node') {
      const p = STATE.projects.find(x => x.id === t.dataset.pjid);
      if (p) p.nodes = p.nodes.filter(n => n.id !== t.dataset.id);
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }

    // Routine ops
    if (act === 'toggle-r') {
      e.stopPropagation();
      const r = STATE.routines[STATE.cycle].find(x => x.id === t.dataset.id);
      if (r) r.done = !r.done;
      render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'edit-r') {
      e.stopPropagation();
      const r = STATE.routines[STATE.cycle].find(x => x.id === t.dataset.id);
      if (r) modalRoutine(r);
      return;
    }
    if (act === 'del-r') {
      e.stopPropagation();
      if (confirm('このルーティンを削除しますか?')) {
        STATE.routines[STATE.cycle] = STATE.routines[STATE.cycle].filter(x => x.id !== t.dataset.id);
        render(); attachDragHandlers(); debouncedSave();
      }
      return;
    }
    if (act === 'modal-save-r-new') {
      const title = document.getElementById('r-title').value.trim();
      if (!title) return;
      const newR = { id: pid(), title, done: false, streak: 0, tagIds: getSelectedTagIds(), dayOfWeek: [] };
      if (STATE.cycle === 'weekly') newR.dayOfWeek = getSelectedDows();
      STATE.routines[STATE.cycle].push(newR);
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
    if (act === 'modal-save-r-edit') {
      const r = STATE.routines[STATE.cycle].find(x => x.id === t.dataset.id);
      if (r) {
        r.title = document.getElementById('r-title').value.trim() || r.title;
        r.tagIds = getSelectedTagIds();
        if (STATE.cycle === 'weekly') r.dayOfWeek = getSelectedDows();
      }
      closeModal(); render(); attachDragHandlers(); debouncedSave(); return;
    }
  });

  // Tag rename via input change in manage modal
  document.addEventListener('change', (e) => {
    const t = e.target.closest('[data-act="rename-tag"]');
    if (!t) return;
    const tag = STATE.tags.find(x => x.id === t.dataset.id);
    if (tag) {
      const newName = t.value.trim();
      if (newName) { tag.name = newName; debouncedSave(); }
    }
  });

  document.getElementById('modalBg').addEventListener('click', (e) => {
    if (e.target.id === 'modalBg') {
      closeModal();
      // After tag manage modal closes, re-render in case tags changed
      render();
      attachDragHandlers();
    }
  });
  document.getElementById('addBtn').addEventListener('click', () => {
    if (STATE.view === 'projects') modalNewProject();
    else modalRoutine(null);
  });
  document.getElementById('addProjectBtn').addEventListener('click', modalNewProject);
  document.getElementById('helpBtn').addEventListener('click', modalHelp);
  document.getElementById('settingsBtn').addEventListener('click', modalSettings);
  document.getElementById('reloadBtn').addEventListener('click', async () => {
    if (STATE.pendingSave) {
      if (!confirm('未保存の変更があります。破棄しますか?')) return;
    }
    document.getElementById('loadingView').style.display = 'block';
    document.getElementById('projectsView').classList.remove('active');
    document.getElementById('routinesView').classList.remove('active');
    STATE.sha = null;
    await loadData();
    document.getElementById('loadingView').style.display = 'none';
    render(); attachDragHandlers();
  });

  window.addEventListener('beforeunload', (e) => {
    if (STATE.pendingSave) { saveDataNow(); e.preventDefault(); e.returnValue = ''; }
  });

  // Scroll: collapse dashboard when scrolled
  let scrollRaf = null;
  window.addEventListener('scroll', () => {
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = null;
      const scrolled = window.scrollY > 60;
      document.body.classList.toggle('scrolled', scrolled);
    });
  }, { passive: true });

  // ============ Init ============
  (async () => {
    const cfg = getConfig();
    if (!cfg) { showSetup(); return; }
    showMain();
    await loadData();
    document.getElementById('loadingView').style.display = 'none';
    render();
    attachDragHandlers();
  })();
</script>
</body>
</html>
